name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST: '1'
      SQL_HOST: localhost
      SQL_PORT: '5432'
      SQL_USER: postgres
      SQL_PASSWORD: pg
      SQL_DB_NAME: postgres
      SQL_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrações no Postgres de teste
        run: for f in supabase/migrations/*.sql; do PGPASSWORD=pg psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"; done
      - run: npm run typecheck
      - run: npm test
      - name: Rotas da API carregam em ESM (como na Vercel)
        run: npm run check:api
      - run: npm run build
