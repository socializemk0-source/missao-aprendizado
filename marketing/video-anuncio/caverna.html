<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Aprova Tico — anúncio da caverna</title>
<!--
  Terceiro anúncio, cartoon cômico: dois "homens das cavernas" estudam do jeito
  antigo (talhando pedra, soterrados por apostilas de pedra), o Tico chega por um
  portal com óculos de realidade aumentada e o app, eles acertam a questão e,
  na revelação, eram só pessoas comuns que não conheciam o Aprova Tico.
  O Tico se mexe pela marionete de tico-rig.js (cabeça, braço, piscada, óculos).
  Mesmas regras: tudo calculado em seek(t). Formato pela URL (?w=1080&h=1920).
-->
<style>
  @font-face { font-family: 'Baloo'; font-weight: 800; src: url(fonts/baloo-2-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 700; src: url(fonts/nunito-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url(fonts/nunito-latin-800-normal.woff2) format('woff2'); }
  :root { --heading: #1d3348; --primary: #1688e8; --primary-strong: #1271bf; --green: #72c93d; --green-strong: #58a92a; --orange: #f7931e; --gold: #f5b700; --cyan: #22d3ee; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b1a2a; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #2a1a12; }
  .layer { position: absolute; inset: 0; }
  .core { position: absolute; left: 0; top: 0; width: 1080px; height: 1500px; transform-origin: 0 0; }
  .abs { position: absolute; will-change: transform, opacity; }
  svg { overflow: visible; display: block; }
  .word { font-family: 'Baloo'; font-weight: 800; line-height: 1; white-space: nowrap; text-align: center; left: 0; width: 1080px; letter-spacing: -1px; }
  .plate { left: 50%; display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: 40px; padding: 26px 46px 20px;
           font-family: 'Baloo'; font-weight: 800; line-height: 1; white-space: nowrap; text-align: center; }
  .plate span { display: block; }
  .stone { background: #9b8f80; color: #fbf3e2; border: 8px solid #6f6457; border-radius: 46px 30px 52px 26px;
           box-shadow: inset 0 -10px 0 rgba(0,0,0,.15), 0 22px 40px rgba(0,0,0,.45); text-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .tech { background: rgba(10,25,45,.88); color: #fff; border: 4px solid var(--cyan); box-shadow: 0 0 40px rgba(34,211,238,.55), 0 22px 40px rgba(0,0,0,.4); }
  .tech b { color: var(--cyan); }
  .white { background: #fff; color: var(--heading); box-shadow: 0 18px 0 rgba(29,51,72,.12), 0 24px 60px rgba(29,51,72,.25); }
  .bubble { background: #fff; color: var(--heading); border: 6px solid var(--heading); border-radius: 50px; padding: 14px 34px 8px;
            font-family: 'Baloo'; font-weight: 800; font-size: 74px; white-space: nowrap; }
  .holo { width: 700px; border-radius: 34px; padding: 30px 34px; background: linear-gradient(180deg, rgba(8,40,70,.92), rgba(10,50,90,.92));
          border: 4px solid rgba(125,233,255,.95); box-shadow: 0 0 60px rgba(34,211,238,.6), inset 0 0 40px rgba(34,211,238,.25);
          color: #fff; font-family: 'Nunito'; font-weight: 800; }
  .holo .eb { font-size: 22px; letter-spacing: 2px; color: #a5f3fc; }
  .holo .q { font-size: 38px; line-height: 1.2; margin-top: 10px; }
  .holo .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
  .holo .o { height: 84px; border-radius: 20px; border: 3px solid rgba(165,243,252,.8); background: rgba(255,255,255,.08);
             display: flex; align-items: center; gap: 16px; padding-left: 16px; font-size: 38px; }
  .holo .o i { font-style: normal; width: 50px; height: 50px; border-radius: 14px; background: rgba(165,243,252,.25); display: grid; place-items: center; font-size: 26px; }
  .holo .fb { margin-top: 18px; height: 0; overflow: hidden; font-size: 30px; color: #bbf7d0; }
  .holo .fb b { font-family: 'Baloo'; font-size: 48px; color: #86efac; display: block; line-height: 1; }
  .chip { display: flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 999px; background: rgba(10,25,45,.9); border: 4px solid var(--cyan);
          color: #fff; font-family: 'Baloo'; font-weight: 800; font-size: 46px; white-space: nowrap; box-shadow: 0 0 30px rgba(34,211,238,.5); }
  .pill { display: flex; align-items: center; gap: 18px; background: #fff; color: var(--primary-strong); border-radius: 999px; padding: 22px 52px;
          font-family: 'Baloo'; font-weight: 800; font-size: 60px; white-space: nowrap; box-shadow: 0 20px 44px rgba(10,30,90,.35); }
  .confetti { width: 22px; height: 34px; border-radius: 5px; }
</style>
</head>
<body>
<div id="stage">
  <div id="room" class="layer"></div>
  <div id="cave" class="layer"></div>
  <div id="core" class="core"></div>
  <div id="cta" class="layer"></div>
  <div id="core2" class="core"></div>
</div>
<script src="tico-rig.js"></script>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const W = Number(qs.get('w')) || 1080;
  const H = Number(qs.get('h')) || 1920;
  const DUR = 26;
  const stage = document.getElementById('stage');
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  const coreScale = Math.min(W / 1080, (H - (H > 1600 ? 420 : 60)) / 1500);
  const coreT = `translate(${(W - 1080 * coreScale) / 2}px, ${(H - 1500 * coreScale) / 2}px) scale(${coreScale})`;
  const core = document.getElementById('core'), core2 = document.getElementById('core2');
  core.style.transform = coreT; core2.style.transform = coreT;
  // camadas de fundo também usam as coordenadas do core (desenhadas maiores que a tela)
  const room = document.getElementById('room'), cave = document.getElementById('cave');
  const roomC = document.createElement('div'); roomC.className = 'core'; roomC.style.transform = coreT; room.appendChild(roomC);
  const caveC = document.createElement('div'); caveC.className = 'core'; caveC.style.transform = coreT; cave.appendChild(caveC);

  // ---------- movimento ----------
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const eo = (x) => 1 - Math.pow(1 - x, 3);
  const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const ei = (x) => x * x * x;
  const back = (x) => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2); // easeOutBack
  const spring = (dt, w = 16, z = 0.55) => {
    if (dt <= 0) return 0;
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
  };
  // vibração amortecida que começa em `at` (tranco, susto, pouso)
  const wob = (t, at, f = 14, d = 5) => (t > at ? Math.exp(-(t - at) * d) * Math.sin((t - at) * f) : 0);
  const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const BEAT = 0.5;
  const beatPulse = (t, from) => (t < from ? 0 : Math.exp(-((t - from) % BEAT) * 9));
  // chave de quadros: [[t, valor], ...] com suavização entre eles
  const keys = (t, ks, ease = eio) => {
    if (t <= ks[0][0]) return ks[0][1];
    for (let i = 1; i < ks.length; i++) if (t <= ks[i][0]) return lerp(ks[i - 1][1], ks[i][1], ease(prog(t, ks[i - 1][0], ks[i][0])));
    return ks[ks.length - 1][1];
  };

  const el = (tag, cls, parent, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    (parent || core).appendChild(e);
    return e;
  };
  const set = (e, { x = 0, y = 0, s = 1, sx, sy, r = 0, o = 1, blur = 0 }) => {
    e.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${sx ?? s}, ${sy ?? s})`;
    e.style.opacity = o;
    e.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
    e.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
  };
  const NS = 'http://www.w3.org/2000/svg';
  const g = (parent, html, attrs = {}) => {
    const e = document.createElementNS(NS, 'g');
    if (html) e.innerHTML = html;
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const rot = (e, a, cx, cy, extra = '') => e.setAttribute('transform', `${extra} rotate(${a} ${cx} ${cy})`);
  const svgIcon = (d, c, size, sw = 3) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

  // =========================================================
  // Sala moderna (aparece na revelação, atrás do cenário da caverna)
  // =========================================================
  roomC.innerHTML = `<svg width="2400" height="2800" viewBox="-660 -650 2400 2800" style="position:absolute;left:-660px;top:-650px">
    <rect x="-660" y="-650" width="2400" height="2800" fill="#eef5fb"/>
    <rect x="-660" y="1180" width="2400" height="1000" fill="#d9b88f"/>
    ${[...Array(14)].map((_, i) => `<rect x="${-660 + i * 170}" y="1180" width="6" height="1000" fill="#c9a77d"/>`).join('')}
    <rect x="230" y="200" width="620" height="560" rx="26" fill="#1d3348"/>
    <rect x="250" y="220" width="580" height="520" rx="16" fill="#9fd8ff"/>
    <circle cx="720" cy="330" r="60" fill="#ffe58a"/>
    ${[[260, 470, 110, 270], [380, 420, 90, 320], [480, 520, 120, 220], [610, 450, 100, 290], [720, 500, 110, 240]].map(([x, y, w, h], i) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${['#7fb3e0', '#5f9bd1', '#8cc2ea', '#6aa6d8', '#7fb3e0'][i]}"/>`).join('')}
    <rect x="530" y="220" width="20" height="520" fill="#1d3348"/><rect x="250" y="470" width="580" height="18" fill="#1d3348"/>
    <rect x="-300" y="300" width="380" height="24" rx="6" fill="#a8693f"/><rect x="-300" y="520" width="380" height="24" rx="6" fill="#a8693f"/>
    ${[...Array(9)].map((_, i) => `<rect x="${-290 + i * 40}" y="${200 + (i % 3) * 8}" width="32" height="${100 - (i % 3) * 8}" rx="4" fill="${['#ef4444', '#1688e8', '#f5b700', '#58a92a', '#7c3aed'][i % 5]}"/><rect x="${-285 + i * 38}" y="${420 + (i % 2) * 10}" width="30" height="${100 - (i % 2) * 10}" rx="4" fill="${['#f7931e', '#1271bf', '#72c93d', '#ef4444'][i % 4]}"/>`).join('')}
    <rect x="1010" y="900" width="120" height="160" rx="20" fill="#e2e8f0"/><circle cx="1070" cy="830" r="90" fill="#58a92a"/><circle cx="1010" cy="880" r="60" fill="#72c93d"/><circle cx="1130" cy="870" r="60" fill="#72c93d"/>
  </svg>`;

  // =========================================================
  // Caverna (cenário que desliza na revelação)
  // =========================================================
  const caveBack = el('div', 'abs', caveC, `<svg width="2400" height="2800" viewBox="-660 -650 2400 2800" style="position:absolute;left:-660px;top:-650px">
    <defs><radialGradient id="cg" cx="50%" cy="58%" r="60%"><stop offset="0" stop-color="#8a5a3a"/><stop offset=".55" stop-color="#5a3a26"/><stop offset="1" stop-color="#2a1a12"/></radialGradient></defs>
    <rect x="-660" y="-650" width="2400" height="2800" fill="url(#cg)"/>
    ${[...Array(26)].map((_, i) => `<ellipse cx="${-500 + rnd(i) * 2100}" cy="${-300 + rnd(i + 40) * 1500}" rx="${60 + rnd(i + 3) * 120}" ry="${30 + rnd(i + 7) * 60}" fill="#000" opacity=".09"/>`).join('')}
    <rect x="-660" y="1180" width="2400" height="1000" fill="#4a3022"/>
    <g stroke="#f3d9b1" stroke-width="9" fill="none" stroke-linecap="round" opacity=".85">
      <circle cx="160" cy="430" r="44"/><path d="M160 474v80M160 500l-40 40M160 500l40 40M160 554l-34 60M160 554l34 60"/>
      <path d="M760 520c30-70 160-70 190 0v80M780 600v-40M930 600v-40M760 540c-30 0-40 30-30 60" />
      <path d="M90 700v60M110 700v60M130 700v60M150 700v60M70 740l100-30M210 700v60M230 700v60"/>
    </g>
    <text x="330" y="330" font-family="Baloo" font-weight="800" font-size="64" fill="#f3d9b1" opacity=".85" transform="rotate(-4 330 330)">PROVA</text><path d="M560 290v60M580 290v60M600 290v60M620 290v60M545 330l90-26" stroke="#f3d9b1" stroke-width="9" opacity=".85" stroke-linecap="round"/>
    <circle cx="520" cy="940" r="120" fill="#ff9a3c" opacity=".18"/>
  </svg>`);
  const caveL = el('div', 'abs', caveC, `<svg width="700" height="2600" viewBox="0 0 700 2600" style="position:absolute;left:-660px;top:-650px"><path d="M0 0H560Q470 600 520 1000T430 1800Q480 2200 560 2600H0z" fill="#3a2418"/><path d="M500 900q60 120 0 260" stroke="#2a1a12" stroke-width="14" fill="none"/></svg>`);
  const caveR = el('div', 'abs', caveC, `<svg width="700" height="2600" viewBox="0 0 700 2600" style="position:absolute;left:1040px;top:-650px"><path d="M700 0H140Q230 600 180 1000T270 1800Q220 2200 140 2600H700z" fill="#3a2418"/></svg>`);
  const caveTop = el('div', 'abs', caveC, `<svg width="2400" height="900" viewBox="0 0 2400 900" style="position:absolute;left:-660px;top:-650px"><path d="M0 0H2400V620${[...Array(14)].map((_, i) => `L${2400 - i * 170 - 40} ${700 + rnd(i) * 160}L${2400 - i * 170 - 85} 620`).join('')}L0 620z" fill="#3a2418"/></svg>`);
  // fogueira
  const fire = el('div', 'abs', caveC); Object.assign(fire.style, { left: '440px', top: '860px', width: '200px', height: '200px' });
  fire.innerHTML = `<svg width="200" height="200" viewBox="0 0 200 200"><g id="flames"></g><rect x="30" y="170" width="140" height="22" rx="10" fill="#5a3a26" transform="rotate(8 100 180)"/><rect x="30" y="170" width="140" height="22" rx="10" fill="#6b4630" transform="rotate(-8 100 180)"/></svg>`;
  const flames = fire.querySelector('#flames');
  const glowCave = el('div', 'abs', caveC); Object.assign(glowCave.style, { left: '-400px', top: '200px', width: '1900px', height: '1600px', background: 'radial-gradient(closest-side, rgba(255,150,60,.35), rgba(255,150,60,0))' });

  // =========================================================
  // Personagens (desenho próprio, articulados)
  // =========================================================
  function pessoa(parent, o) {
    const wrap = el('div', 'abs', parent);
    Object.assign(wrap.style, { left: o.x + 'px', top: o.y + 'px', width: '420px', height: '1000px', transformOrigin: '210px 900px' });
    const S = 0.82; // escala do desenho
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('width', 420); s.setAttribute('height', 1000); s.setAttribute('viewBox', '0 0 420 1000');
    wrap.appendChild(s);
    const P = { wrap, o };
    const arm = (side) => {
      const x = side < 0 ? 95 : 325;
      const a = g(s, `
        <rect x="${x - 36}" y="380" width="72" height="300" rx="36" fill="${o.roupa}" stroke="#2a1a12" stroke-width="7"/>
        <rect class="pele" x="${x - 36}" y="380" width="72" height="300" rx="36" fill="${o.pele}" stroke="#2a1a12" stroke-width="7"/>
        <circle cx="${x}" cy="690" r="44" fill="${o.pele}" stroke="#2a1a12" stroke-width="7"/><circle cx="${x - 30}" cy="668" r="16" fill="${o.pele}" stroke="#2a1a12" stroke-width="7"/>`);
      a.querySelector('.pele').style.transition = 'none';
      return { g: a, x, y: 400, pele: a.querySelector('.pele') };
    };
    P.armBack = arm(o.flip ? 1 : -1);
    // tronco: roupa moderna + fantasia de pele por cima
    P.torso = g(s, `<rect x="70" y="355" width="280" height="660" rx="115" fill="${o.roupa}" stroke="#2a1a12" stroke-width="7"/>${o.roupaDetalhe || ''}`);
    P.tunic = g(s, `<path d="M66 420 Q70 370 120 360 L300 360 Q352 372 354 430 L354 1015 L66 1015 Z" fill="#d9a066" stroke="#2a1a12" stroke-width="7"/>
      <path d="M66 470 L100 440 L130 480 L165 440 L200 482 L235 440 L270 482 L305 440 L354 480" fill="none" stroke="#8a5a2b" stroke-width="10" stroke-linejoin="round"/>
      ${[[120, 560], [250, 520], [180, 680], [300, 700], [110, 800], [240, 860]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="26" ry="18" fill="#7a4a24" opacity=".75"/>`).join('')}
      <path d="M300 360 L150 560" stroke="#8a5a2b" stroke-width="22" stroke-linecap="round"/>`);
    P.neck = g(s, `<rect x="178" y="300" width="64" height="80" fill="${o.pele}" stroke="#2a1a12" stroke-width="7"/>`);
    P.head = g(s);
    P.hairBack = g(P.head, o.cabeloAtras || '');
    g(P.head, `<circle cx="102" cy="238" r="28" fill="${o.pele}" stroke="#2a1a12" stroke-width="7"/><circle cx="318" cy="238" r="28" fill="${o.pele}" stroke="#2a1a12" stroke-width="7"/>
      <ellipse cx="210" cy="228" rx="112" ry="120" fill="${o.pele}" stroke="#2a1a12" stroke-width="7"/>
      <ellipse cx="150" cy="282" rx="18" ry="11" fill="#ff8f8f" opacity=".35"/><ellipse cx="270" cy="282" rx="18" ry="11" fill="#ff8f8f" opacity=".35"/>`);
    P.hair = g(P.head, o.cabelo);
    P.eyes = g(P.head, `<ellipse cx="165" cy="232" rx="23" ry="27" fill="#fff"/><ellipse cx="255" cy="232" rx="23" ry="27" fill="#fff"/>`);
    P.pupils = g(P.eyes, `<circle cx="168" cy="236" r="12" fill="#1d3348"/><circle cx="258" cy="236" r="12" fill="#1d3348"/><circle cx="172" cy="231" r="4" fill="#fff"/><circle cx="262" cy="231" r="4" fill="#fff"/>`);
    P.brows = g(P.head, `<path d="M140 190 q25 -12 50 0 M230 190 q25 -12 50 0" stroke="#3a2a20" stroke-width="8" fill="none" stroke-linecap="round"/>`);
    g(P.head, `<ellipse cx="210" cy="268" rx="15" ry="11" fill="#000" opacity=".12"/>`);
    P.glasses = g(P.head, o.oculos ? `<circle cx="165" cy="232" r="38" fill="none" stroke="#1d3348" stroke-width="8"/><circle cx="255" cy="232" r="38" fill="none" stroke="#1d3348" stroke-width="8"/><path d="M203 230 h14" stroke="#1d3348" stroke-width="8"/>` : '');
    // fantasia da cabeça: peruca, sobrancelha única e barba postiça
    P.beard = g(P.head, `<path d="M98 250 Q96 400 210 430 Q324 400 322 250 Q300 300 270 300 Q240 330 210 316 Q180 330 150 300 Q120 300 98 250z" fill="#5b3a22"/>
      <path d="M120 330 l-10 30 M160 360 l-6 32 M210 372 v34 M260 360 l6 32 M300 330 l10 30" stroke="#3f2716" stroke-width="7" stroke-linecap="round"/>`);
    P.mouthSmile = g(P.head, `<path d="M180 300 q30 22 60 0" stroke="#7a3b2e" stroke-width="9" fill="none" stroke-linecap="round"/>`);
    P.mouthOpen = g(P.head, `<ellipse cx="210" cy="310" rx="34" ry="30" fill="#5c1f1a"/><ellipse cx="210" cy="324" rx="20" ry="12" fill="#ff7a7a"/>`);
    P.mouthFlat = g(P.head, `<path d="M184 306 h52" stroke="#7a3b2e" stroke-width="9" stroke-linecap="round"/>`);
    P.unibrow = g(P.head, `<path d="M128 196 Q170 168 210 188 Q250 168 292 196 L292 208 Q250 186 210 204 Q170 186 128 208z" fill="#2b1a10"/>`);
    P.wig = g(P.head, `<path d="M84 230 L70 150 L110 160 L100 90 L150 120 L160 50 L200 100 L230 40 L250 100 L300 60 L300 120 L350 110 L330 170 L360 200 L330 236 Q330 120 210 112 Q92 120 84 230z" fill="#4a2c18"/>
      <path d="M140 140 l20 -30 M250 130 l20 -36 M300 160 l26 -10" stroke="#2b1a10" stroke-width="7" stroke-linecap="round"/>`);
    P.armFront = arm(o.flip ? -1 : 1);
    P.prop = g(P.armFront.g, o.prop || '');
    P.phone = g(P.armFront.g, `<rect x="${P.armFront.x - 34}" y="650" width="68" height="110" rx="14" fill="#1d3348" transform="rotate(-10 ${P.armFront.x} 700)"/><circle cx="${P.armFront.x}" cy="712" r="42" fill="${o.pele}"/>`);
    P.dizzy = g(s, [0, 1, 2].map((i) => `<path d="M0 -26 l7 18 l19 1 l-15 12 l5 19 l-16 -11 l-16 11 l5 -19 l-15 -12 l19 -1z" fill="#f5b700" data-i="${i}"/>`).join(''));
    return P;
  }
  const A = pessoa(core, {
    x: 10, y: 300, pele: '#c58b62', roupa: '#7c3aed',
    roupaDetalhe: '<path d="M150 360 q60 70 120 0" fill="none" stroke="#5b21b6" stroke-width="14"/><rect x="150" y="620" width="120" height="70" rx="20" fill="#6d28d9"/>',
    cabelo: '<path d="M96 220 Q90 104 210 100 Q330 104 324 220 Q300 150 210 148 Q120 150 96 220z" fill="#1d1410"/>',
    cabeloAtras: '<ellipse cx="330" cy="200" rx="40" ry="90" fill="#1d1410" transform="rotate(-20 330 200)"/>', oculos: true,
    prop: '<ellipse cx="325" cy="745" rx="50" ry="38" fill="#8f8a84"/><ellipse cx="312" cy="735" rx="18" ry="10" fill="#b5b0aa"/>',
  });
  const B = pessoa(core, {

      }
      const fright = spring(t - 6.2, 18, 0.35);
      if (t > 6.15 && t < 9.0) { x = 60 * fright; lean = 8 * fright; mouth = 'open'; lookX = -12; lookY = -4; head = 8 * fright; y = -60 * Math.max(0, Math.sin(Math.min(Math.PI, (t - 6.2) * 6))); armF = lerp(30, -140, fright); armB = lerp(20, -150, fright); }
      if (t >= 9.0 && t < 15.0) {
        const come = eio(prog(t, 9.0, 9.8));
        x = lerp(60, -20, come); lean = lerp(8, -4, come); mouth = t > 11.5 ? 'open' : 'flat'; lookX = -14; lookY = -14; head = -6; armF = 20; armB = 10;
        const jump = t > 12.0 && t < 13.0 ? Math.abs(Math.sin((t - 12.0) * Math.PI * 2 + 0.6)) : 0;
        y = -50 * jump; if (t > 12.0 && t < 13.0) { armF = -150 + Math.sin(t * 13) * 10; armB = -150 + Math.cos(t * 13) * 10; }
      }
      let costume = 1, wigOn = true, beardOn = true, phone = false;
      if (t >= 15.0) {
        x = -20; lean = 0; mouth = 'flat'; lookX = 0; lookY = 0; head = 0; armF = 20; armB = 10;
        if (t > 15.6) { armB = keys(t, [[15.6, 10], [15.8, -175], [16.0, -175], [16.25, 10]]); }
        if (t > 15.9) wigOn = beardOn = false;
        costume = 1 - prog(t, 15.95, 16.35);
        if (t > 16.4) { mouth = 'smile'; phone = true; armF = -40 + Math.sin(t * 3 + 1) * 4; head = -4 + Math.sin(t * 2 + 1) * 2; lookX = -6; }
        if (t > 17.6) { armB = -150 + Math.sin(t * 9 + 1) * 14; }
      }
      pose(B, { x, y, lean, sx, sy, head, headY, armF, armB, mouth, lookX, lookY, dizzy, costume, wigOn, beardOn, phone });
      blinkH(B, 7);
    }
    // perucas e barbas voando
    [[flyWigA, 15.75, 50, 380, -1], [flyWigB, 15.9, 720, 390, 1]].forEach(([e, at, x0, y0, dir]) => {
      const p = Math.max(0, t - at);
      if (!e.innerHTML) e.innerHTML = `<svg width="420" height="460" viewBox="0 0 420 460">${A.wig.innerHTML}${A.beard.innerHTML}</svg>`;
      Object.assign(e.style, { left: x0 + 'px', top: y0 + 'px', transformOrigin: '210px 230px', width: '420px', height: '460px' });
      set(e, { x: dir * 500 * p, y: -900 * p + 1400 * p * p, r: dir * 400 * p, s: 0.82, o: t > at && t < at + 1.2 ? 1 : 0 });
    });
    smoke.forEach((s, i) => {
      const at = (i < 11 ? 15.75 : 15.9) + rnd(i) * 0.15; const p = prog(t, at, at + 0.9);
      set(s, { s: p > 0 ? 0.3 + 0.9 * eo(p) : 0, o: p > 0 && p < 1 ? (p < 0.6 ? 1 : 1 - (p - 0.6) / 0.4) : 0, y: -60 * p });
    });

    // ===== portal, Tico, holograma =====
    {
      const open = eo(prog(t, 6.0, 6.5)) * (1 - eio(prog(t, 7.6, 8.1)));
      set(portal, { s: open * (1 + 0.03 * Math.sin(t * 20)), o: open > 0.01 ? 1 : 0 });
      spin.setAttribute('transform', `rotate(${t * 140})`); spin2.setAttribute('transform', `rotate(${-t * 90})`);
      // voo: sai do portal (centro 540,640), faz um arco e pousa em 7,2 s
      const fly = prog(t, 6.35, 7.2);
      const fe = eio(fly);
      const ox = lerp(0, 0, fe) + Math.sin(fly * Math.PI) * 220, oy = lerp(-300, 0, fe) - Math.sin(fly * Math.PI) * 120;
      const sc = lerp(0.25, 1, eo(fly));
      const land = wob(t, 7.2, 16, 6);
      const onBoard = t < 7.55;
      // quando desce do skate: pequeno pulo para o chão
      const hop = t >= 7.55 && t < 8.0 ? Math.sin(((t - 7.55) / 0.45) * Math.PI) * 70 : 0;
      const floorDrop = t >= 7.55 ? 40 * eio(prog(t, 7.55, 8.0)) : 0;
      let sx = 1 - 0.14 * land, sy = 1 + 0.14 * land;
      if (t > 7.95 && t < 8.4) { const l2 = wob(t, 7.98, 18, 7); sx = 1 + 0.1 * l2; sy = 1 - 0.1 * l2; }
      const breath = Math.sin(t * 2.6) * 0.012;
      // fim: Tico vai para a direita na revelação para dar lugar às pessoas
      const slide = eio(prog(t, 16.3, 16.9));
      ticoBox.style.transform = `translate(${ox + 0 * slide}px, ${oy - hop + floorDrop}px) scale(${sc * sx * (1 - breath) * lerp(1, 0.82, slide)}, ${sc * sy * (1 + breath) * lerp(1, 0.82, slide)}) rotate(${(1 - fe) * -18 + Math.sin(t * 3) * (onBoard ? 2 : 0.6)}deg)`;
      ticoBox.style.opacity = t < 6.35 ? 0 : 1 - prog(t, 19.7, 19.9);
      board.style.opacity = onBoard ? 1 : 1 - prog(t, 7.55, 7.75);
      board.style.transform = t >= 7.55 ? `translate(${400 * ei(prog(t, 7.55, 8.1))}px, ${-60 * ei(prog(t, 7.55, 8.1))}px) rotate(${-20 * prog(t, 7.55, 8.1)}deg)` : `translateY(${Math.sin(t * 8) * 4}px)`;
      trail.style.opacity = fly > 0 && fly < 1 ? 1 - fly * 0.6 : 0;
      trail.style.transform = `scaleX(${1 - fly}) rotate(${-10}deg)`;
      // pose do Tico ao longo do vídeo
      let tp = 'acenando', head = Math.sin(t * 2.1) * 3, nod = 0, arm = 0, visor = 1, lookX = 0;
      if (t < 8.4) { tp = 'acenando'; arm = Math.sin(t * 11) * 14; head += 4; }
      else if (t < 13.0) { tp = 'neutro'; head = Math.sin(t * 1.7) * 2.5 - 3; nod = Math.max(0, Math.sin((t - 8.4) * Math.PI * 2)) * 4; }
      else if (t < 15.0) { tp = 'joinha'; arm = Math.sin(t * 7) * 6; head = 5 + Math.sin(t * 3) * 3; }
      else if (t < 15.9) { tp = 'apontando'; head = -6 + Math.sin(t * 2) * 2; arm = Math.sin(t * 4) * 4; }
      else { tp = 'estrela'; arm = Math.sin(t * 6) * 10; head = Math.sin(t * 2.4) * 4; }
      // troca de pose com "estica e amassa" curto para esconder o corte
      const switches = [8.4, 13.0, 15.0, 15.9];
      const sw = switches.reduce((m, s2) => Math.max(m, t >= s2 && t < s2 + 0.25 ? Math.exp(-(t - s2) * 14) : 0), 0);
      if (sw > 0) ticoBox.style.transform += ` scale(${1 + 0.08 * sw}, ${1 - 0.08 * sw})`;
      const blink = tp === 'neutro' || tp === 'acenando' || tp === 'apontando' ? TicoRig.blinkAt(t, 2) : 0;
      if (tico) tico.draw({ pose: tp, head, nod, arm, blink, visor, lookX, time: t });
      ticoPhone.style.opacity = tp === 'neutro' ? 1 : 0;
      ticoPhone.style.transform = `rotate(${-8 + Math.sin(t * 2.3) * 2}deg)`;
      // holograma
      const ho = spring(t - 8.6, 12, 0.6) * (1 - eio(prog(t, 12.9, 13.3)));
      set(beam, { sy: ho, o: clamp(ho) * (0.7 + 0.3 * Math.sin(t * 17)) });
      set(holo, { s: lerp(0.2, 1, ho), o: clamp(ho * 2), y: Math.sin(t * 2) * 6 });
      holo.style.filter = `drop-shadow(0 0 ${20 + 10 * Math.sin(t * 6)}px rgba(34,211,238,.6))`;
      const picked = t >= 10.9, ok = t >= 11.25;
      holoOpts.forEach((o, i) => {
        const isC = i === 2;
        o.style.background = isC && ok ? 'rgba(114,201,61,.55)' : isC && picked ? 'rgba(34,211,238,.45)' : 'rgba(255,255,255,.08)';
        o.style.borderColor = isC && ok ? '#86efac' : 'rgba(165,243,252,.8)';
        o.style.transform = isC ? `scale(${1 + 0.08 * (t > 10.9 ? Math.exp(-(t - 10.9) * 8) : 0)})` : '';
      });
      holoFb.style.height = 110 * eo(prog(t, 11.25, 11.6)) + 'px';
      holo.style.zIndex = t > 11.2 ? 9 : 4;
      chips.forEach((c, i) => {
        const k = spring(t - (13.1 + i * 0.35), 16, 0.5);
        c.style.transform = `translateX(-50%) translateY(${60 * (1 - k)}px) scale(${lerp(0.4, 1, k)})`;
        c.style.opacity = t < 13.1 + i * 0.35 || t > 14.95 ? 0 : clamp(k * 3);
      });
    }

    // falas
    const kA = spring(t - 6.2, 18, 0.4), kB = spring(t - 11.7, 18, 0.4);
    set(bubA, { s: kA * (1 - prog(t, 8.2, 8.4)), o: t > 6.2 && t < 8.4 ? 1 : 0, r: -6 + wob(t, 6.2, 20, 4) * 6 });
    set(bubB, { s: kB * (1 - prog(t, 13.0, 13.2)), o: t > 11.7 && t < 13.2 ? 1 : 0, r: 5 + wob(t, 11.7, 20, 4) * 6 });

    showPlate(p1, 0.15, 2.95);
    showPlate(p2, 3.05, 5.95, 1.5);
    showPlate(p3, 7.35, 8.65, -1);
    showPlate(p4, 15.0, 15.85);
    showPlate(p5, 16.9, 19.75, 0);
    p5l2.style.opacity = clamp((t - 17.7) * 4);
    p5l2.style.transform = `translateY(${20 * (1 - eo(prog(t, 17.7, 18.0)))}px)`;

    // ===== chamada final =====
    {
      const open = eio(prog(t, 19.85, 20.35));
      const F = document.getElementById('cta');
      F.style.clipPath = open >= 1 ? 'none' : `circle(${open * Math.hypot(W, H) * 0.6}px at 50% 50%)`;
      F.style.visibility = t < 19.85 ? 'hidden' : 'visible';
      rays.style.transform = `rotate(${t * 8}deg) scale(${0.8 + 0.2 * open})`;
      set(Fc, { o: t < 19.9 ? 0 : 1 });
      const k1 = spring(t - 20.2, 16, 0.5), k2 = spring(t - 20.5, 18, 0.38);
      set(ft1, { y: 60 * (1 - k1), o: clamp(k1 * 3) });
      set(ft2, { s: lerp(0.3, 1, k2) * (1 + 0.04 * beatPulse(t, 21.0)), o: clamp(k2 * 3), r: -3 });
      const kt = spring(t - 20.15, 11, 0.5);
      const hop = t > 20.8 ? Math.abs(Math.sin((t - 20.8) * Math.PI * 2)) : 0;
      const land = t > 20.8 ? Math.pow(1 - hop, 6) : 0;
      ticoFBox.style.transform = `translateY(${700 * (1 - kt) - hop * 40}px) scale(${lerp(0.6, 1, kt) * (1 + 0.07 * land)}, ${lerp(0.6, 1, kt) * (1 - 0.07 * land)})`;
      if (ticoF) ticoF.draw({ pose: 'comemorando', head: Math.sin(t * Math.PI * 2) * 5, arm: Math.sin(t * Math.PI * 4) * 12, visor: 1, time: t });
      const ks = spring(t - 21.1, 14, 0.6);
      set(fsub, { y: 30 * (1 - ks), o: clamp(ks * 3) });
      const kp = spring(t - 21.4, 16, 0.45);
      fpill.style.transform = `translateX(-50%) scale(${kp * (1 + 0.05 * beatPulse(t, 22.0))})`;
      fpill.style.opacity = clamp(kp * 3);
      confs.forEach((c, i) => {
        const at = 20.35 + rnd(i) * 0.5; const p = Math.max(0, t - at);
        const x0 = W * (0.5 + (rnd(i + 1) - 0.5) * 0.3), vx = (rnd(i + 2) - 0.5) * W * 1.4, vy = -H * (0.45 + rnd(i + 3) * 0.55);
        const x = x0 + vx * p * Math.exp(-p * 0.6); const y = H * 0.48 + vy * p + 0.5 * H * 1.15 * p * p;
        set(c, { x, y, r: p * (300 + rnd(i + 4) * 500), sx: Math.cos(p * (6 + rnd(i) * 6)), sy: 1, o: t > at && y < H + 60 ? 1 : 0 });
      });
    }
  }

  window.DURATION = DUR;
  window.seek = seek;
  window.ready = (async () => {
    await document.fonts.ready;
    await TicoRig.load('../../public/tico/');
    tico = TicoRig.create(ticoBox, 620);
    ticoBox.insertBefore(tico.el, ticoPhone);
    ticoF = TicoRig.create(ticoFBox, 580);
    await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
    seek(0);
    return true;
  })();
  if (!navigator.webdriver) {
    const t0 = performance.now();
    const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    window.ready.then(loop);
  }
})();
</script>
</body>
