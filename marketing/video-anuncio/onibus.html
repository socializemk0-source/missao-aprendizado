<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Aprova Tico — anúncio no ônibus</title>
<!--
  Segundo anúncio: o Tico, de pé num ônibus lotado, estuda pelo celular no
  caminho. Desenho tipo cartoon. Mesmas regras de anuncio.html: tudo calculado
  em seek(t), sem animação CSS nem timers. Formato pela URL (?w=1080&h=1920).
-->
<style>
  @font-face { font-family: 'Baloo'; font-weight: 800; src: url(fonts/baloo-2-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 700; src: url(fonts/nunito-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url(fonts/nunito-latin-800-normal.woff2) format('woff2'); }
  :root {
    --heading: #1d3348; --text-2: #4d6478; --primary: #1688e8; --primary-strong: #1271bf; --primary-soft: #edf7ff;
    --green: #72c93d; --green-strong: #58a92a; --green-soft: #ecfae5; --orange: #f7931e; --gold: #f5b700;
    --border: #e1e9ef; --muted: #e8eef4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b1a2a; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #cfe9ff; }
  .layer { position: absolute; inset: 0; }
  #core { position: absolute; left: 0; top: 0; width: 1080px; height: 1500px; transform-origin: 0 0; }
  .abs { position: absolute; will-change: transform, opacity; }
  svg { overflow: visible; }
  .word { font-family: 'Baloo'; font-weight: 800; line-height: 1; white-space: nowrap; text-align: center; left: 0; width: 1080px; letter-spacing: -1px; }
  .plate { left: 50%; display: flex; flex-direction: column; align-items: center; gap: 4px; background: #fff; border-radius: 40px;
           padding: 26px 46px 22px; box-shadow: 0 18px 0 rgba(29,51,72,.12), 0 24px 60px rgba(29,51,72,.18);
           font-family: 'Baloo'; font-weight: 800; line-height: 1; white-space: nowrap; color: var(--heading); text-align: center; }
  .plate span { display: block; }
  .chip { display: flex; align-items: center; gap: 14px; background: var(--heading); color: #fff; border-radius: 999px;
          padding: 12px 30px 12px 18px; font-family: 'Nunito'; font-weight: 800; font-size: 38px; white-space: nowrap; }
  .chip.gold { background: #fff; color: #b45309; border: 5px solid var(--gold); font-family: 'Baloo'; font-size: 46px; }
  .sign { background: #1f8a4c; color: #fff; border: 8px solid #fff; border-radius: 26px; padding: 18px 40px 14px;
          font-family: 'Baloo'; font-weight: 800; text-align: center; line-height: 1; box-shadow: 0 24px 50px rgba(0,0,0,.3); white-space: nowrap; }
  .sign small { display: block; font-family: 'Nunito'; font-size: 34px; opacity: .9; margin-bottom: 6px; }
  .sign b { font-size: 84px; color: #fff3b0; }
  /* Celular (tela cheia na cena da questão) */
  .phone { width: 620px; height: 1090px; border-radius: 76px; background: #1d3348; padding: 18px; box-shadow: 0 50px 90px rgba(0,0,0,.45); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 60px; background: #f9fbfd; overflow: hidden; }
  .notch { position: absolute; left: 50%; top: 18px; width: 150px; height: 34px; margin-left: -75px; border-radius: 20px; background: #1d3348; }
  .topbar { position: absolute; left: 34px; right: 34px; top: 74px; display: flex; justify-content: space-between; align-items: center; }
  .hearts { display: flex; gap: 6px; }
  .xp { display: flex; align-items: center; gap: 8px; background: #fef3c7; border: 3px solid #fde68a; color: #b45309;
        font-family: 'Nunito'; font-weight: 800; font-size: 28px; padding: 6px 16px 6px 10px; border-radius: 999px; }
  .bar { position: absolute; left: 34px; right: 34px; top: 140px; height: 18px; border-radius: 999px; background: var(--muted); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--green); }
  .eyebrow { position: absolute; left: 34px; top: 190px; font-family: 'Nunito'; font-weight: 800; font-size: 22px; letter-spacing: 1.5px; color: var(--primary); }
  .question { position: absolute; left: 34px; right: 34px; top: 232px; font-family: 'Nunito'; font-weight: 800; font-size: 33px; line-height: 1.28; color: var(--heading); }
  .opt { position: absolute; left: 34px; right: 34px; height: 82px; border-radius: 20px; border: 4px solid var(--border); background: #fff;
         display: flex; align-items: center; gap: 18px; padding-left: 16px; font-family: 'Nunito'; font-weight: 800; font-size: 28px; color: var(--heading); white-space: nowrap; }
  .opt .letter { flex: none; width: 50px; height: 50px; border-radius: 14px; background: var(--muted); display: grid; place-items: center; font-size: 26px; color: var(--text-2); }
  .btn { position: absolute; left: 34px; right: 34px; top: 818px; height: 92px; border-radius: 24px; display: grid; place-items: center;
         font-family: 'Nunito'; font-weight: 800; font-size: 34px; color: #fff; background: var(--primary); }
  .feedback { position: absolute; left: 0; right: 0; bottom: 0; height: 252px; background: var(--green-soft); border-top: 5px solid var(--green); padding: 28px 34px 0; }
  .feedback h4 { font-family: 'Baloo'; font-weight: 800; font-size: 50px; color: var(--green-strong); line-height: 1; }
  .feedback p { font-family: 'Nunito'; font-weight: 700; font-size: 28px; color: var(--heading); margin-top: 12px; line-height: 1.3; }
  .feedback b { color: var(--green-strong); }
  .done { position: absolute; inset: 0; background: rgba(29,51,72,.55); display: grid; place-items: center; }
  .done div { background: #fff; border-radius: 40px; padding: 40px 40px 34px; text-align: center; width: 470px; }
  .done h4 { font-family: 'Baloo'; font-weight: 800; font-size: 58px; color: var(--heading); line-height: 1; margin-top: 10px; }
  .done p { font-family: 'Nunito'; font-weight: 800; font-size: 32px; color: #b45309; margin-top: 10px; }
  .touch { width: 92px; height: 92px; border-radius: 50%; background: rgba(255,255,255,.55); border: 6px solid rgba(29,51,72,.75); box-shadow: 0 10px 24px rgba(0,0,0,.2); }
  .ripple { width: 92px; height: 92px; border-radius: 50%; border: 6px solid var(--primary); }
  .tile { width: 300px; height: 330px; border-radius: 40px; background: #fff; box-shadow: 0 22px 50px rgba(29,51,72,.14);
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          font-family: 'Baloo'; font-weight: 800; font-size: 46px; color: var(--heading); }
  .pill { display: flex; align-items: center; gap: 18px; background: #fff; color: var(--primary-strong); border-radius: 999px; padding: 22px 52px;
          font-family: 'Baloo'; font-weight: 800; font-size: 60px; white-space: nowrap; box-shadow: 0 20px 44px rgba(10,30,90,.35); }
  .confetti { width: 22px; height: 34px; border-radius: 5px; }
</style>
</head>
<body>
<div id="stage">
  <div id="sky" class="layer"></div>
  <div id="core"></div>
  <div id="panel" class="layer"></div>
  <div id="cta" class="layer"></div>
  <div id="core2"></div>
</div>
<script>
(() => {
  // ---------- Formato ----------
  const qs = new URLSearchParams(location.search);
  const W = Number(qs.get('w')) || 1080;
  const H = Number(qs.get('h')) || 1920;
  const DUR = 24;
  const stage = document.getElementById('stage');
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  const coreScale = Math.min(W / 1080, (H - (H > 1600 ? 420 : 60)) / 1500);
  const coreT = `translate(${(W - 1080 * coreScale) / 2}px, ${(H - 1500 * coreScale) / 2}px) scale(${coreScale})`;
  // core: cenas do ônibus · core2: o que fica por cima dos painéis cheios (montagem e chamada)
  const core = document.getElementById('core');
  const core2 = document.getElementById('core2');
  for (const c of [core, core2]) Object.assign(c.style, { position: 'absolute', left: 0, top: 0, width: '1080px', height: '1500px', transformOrigin: '0 0', transform: coreT });

  // ---------- Movimento ----------
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const eo = (x) => 1 - Math.pow(1 - x, 3);
  const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const ei = (x) => x * x * x;
  const spring = (dt, w = 16, z = 0.55) => {
    if (dt <= 0) return 0;
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
  };
  const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const BEAT = 0.5;
  const beatPulse = (t, from) => (t < from ? 0 : Math.exp(-((t - from) % BEAT) * 9));
  // Buracos na rua: cada um dá um tranco que balança tudo.
  const BUMPS = [4.5, 6.0, 7.5, 12.25, 15.0, 16.5];
  const bump = (t) => BUMPS.reduce((s, b) => s + (t > b ? Math.exp(-(t - b) * 5) * Math.sin((t - b) * 17) : 0), 0);

  // ---------- Montagem ----------
  const el = (tag, cls, parent, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    (parent || core).appendChild(e);
    return e;
  };
  const set = (e, { x = 0, y = 0, s = 1, sx, sy, r = 0, o = 1, blur = 0, ox, oy }) => {
    e.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${sx ?? s}, ${sy ?? s})`;
    e.style.opacity = o;
    e.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
    e.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
    if (ox != null) e.style.transformOrigin = `${ox} ${oy}`;
  };
  const img = (src, cls, parent) => { const i = el('img', cls, parent); i.src = src; i.decoding = 'sync'; return i; };
  const TICO = (pose) => `../../public/tico/${pose}.webp`;
  const svg = (d, c = '#fff', size = 64, sw = 3) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const ICON = {
    arrow: '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  };
  const heart = `<svg width="38" height="38" viewBox="0 0 24 24"><path fill="#ef4444" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>`;
  const star = (s = 34) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="#f5b700" stroke="#d99a00" stroke-width="1.2" d="m12 2.5 2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>`;
  const flame = `<svg width="56" height="56" viewBox="0 0 24 24"><path fill="#f7931e" d="M12 2c1 4 5 5.5 5 10.5A5 5 0 0 1 7 12.5c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5.5 1-9z"/><path fill="#f5b700" d="M12 12c.6 1.8 2.5 2.4 2.5 4.6a2.5 2.5 0 0 1-5 0c0-1.3.7-2 1.3-2.6 0 .9.4 1.4 1 1.4 0-1.4-.6-2.3.2-3.4z"/></svg>`;

  // ---------- Cidade que passa (faixa repetida) ----------
  const PERIOD = 1600;
  function cidade(id) {
    let s = '';
    for (let copy = 0; copy < 3; copy++) {
      let x = copy * PERIOD;
      let i = 0;
      // prédios do fundo, mais claros
      while (x < (copy + 1) * PERIOD) {
        const w = 150 + rnd(i * 3 + 1) * 120, h = 260 + rnd(i * 3 + 2) * 260;
        s += `<rect x="${x}" y="${600 - h}" width="${w}" height="${h}" rx="8" fill="${['#b9d4ec', '#c9dcef', '#acc8e4'][i % 3]}"/>`;
        x += w + 10; i++;
      }
      x = copy * PERIOD + 40; i = 50;
      // prédios da frente, coloridos, com janelas
      while (x < (copy + 1) * PERIOD - 60) {
        const w = 170 + rnd(i * 5 + 1) * 120, h = 170 + rnd(i * 5 + 2) * 200;
        const c = ['#f7b267', '#f4845f', '#7fc8a9', '#f6d365', '#9bb7ff', '#e6a4d6'][i % 6];
        s += `<rect x="${x}" y="${600 - h}" width="${w}" height="${h + 10}" rx="10" fill="${c}"/>`;
        for (let wy = 600 - h + 26; wy < 560; wy += 58)
          for (let wx = x + 22; wx < x + w - 40; wx += 52)
            s += `<rect x="${wx}" y="${wy}" width="30" height="34" rx="5" fill="#fff" opacity=".75"/>`;
        // árvore entre prédios
        if (i % 2 === 0) s += `<rect x="${x + w + 28}" y="520" width="14" height="80" fill="#8a5a3c"/><circle cx="${x + w + 35}" cy="500" r="48" fill="#58a92a"/><circle cx="${x + w + 10}" cy="520" r="32" fill="#72c93d"/>`;
        x += w + 90; i++;
      }
      s += `<rect x="${copy * PERIOD}" y="600" width="${PERIOD}" height="80" fill="#9aa7b4"/>`;
    }
    return `<svg id="${id}" width="${PERIOD * 3}" height="700" viewBox="0 0 ${PERIOD * 3} 700">${s}</svg>`;
  }

  // ---------- Passageiros (desenho simples, ninguém real) ----------
  function pessoa({ pele, roupa, cabelo, tipo = 'curto', olhos = 'aberto', bracoX = 90, celular = false, fone = false }) {
    const hair = {
      curto: `<path d="M80 200 Q80 110 160 112 Q242 110 240 200 Q225 150 160 150 Q100 152 80 200z" fill="${cabelo}"/>`,
      coque: `<circle cx="160" cy="105" r="38" fill="${cabelo}"/><path d="M76 215 Q72 118 160 120 Q248 118 244 215 Q230 160 160 158 Q92 160 76 215z" fill="${cabelo}"/>`,
      cacho: [[100, 150], [130, 125], [165, 118], [200, 125], [228, 152], [86, 185], [240, 188]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="36" fill="${cabelo}"/>`).join(''),
      bone: `<path d="M78 190 Q80 112 160 112 Q240 112 242 190z" fill="${cabelo}"/><path d="M200 180 Q270 178 292 196 L238 198z" fill="${cabelo}"/>`,
    }[tipo];
    const eyes = olhos === 'dormindo'
      ? `<path d="M120 222 q12 10 24 0 M178 222 q12 10 24 0" stroke="#1d3348" stroke-width="7" fill="none" stroke-linecap="round"/>`
      : olhos === 'baixo'
        ? `<ellipse cx="132" cy="228" rx="9" ry="6" fill="#1d3348"/><ellipse cx="190" cy="228" rx="9" ry="6" fill="#1d3348"/>`
        : `<circle cx="132" cy="218" r="10" fill="#1d3348"/><circle cx="190" cy="218" r="10" fill="#1d3348"/>`;
    const mouth = olhos === 'dormindo' ? `<ellipse cx="160" cy="262" rx="10" ry="8" fill="#7a3b2e"/>` : `<path d="M140 258 q20 14 40 0" stroke="#7a3b2e" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    const phone = celular ? `<path d="M250 560 L200 470" stroke="${roupa}" stroke-width="64" stroke-linecap="round"/><rect x="168" y="400" width="62" height="100" rx="12" fill="#1d3348" transform="rotate(-12 200 450)"/><circle cx="206" cy="482" r="26" fill="${pele}"/>` : '';
    const fones = fone ? `<path d="M74 210 Q74 96 160 96 Q246 96 246 210" stroke="#1d3348" stroke-width="12" fill="none"/><rect x="58" y="196" width="34" height="52" rx="14" fill="#ef4444"/><rect x="228" y="196" width="34" height="52" rx="14" fill="#ef4444"/>` : '';
    return `<svg width="320" height="1100" viewBox="0 0 320 1100">
      <path d="M70 380 L${bracoX} 60" stroke="${roupa}" stroke-width="60" stroke-linecap="round"/>
      <circle cx="${bracoX}" cy="52" r="30" fill="${pele}"/>
      <rect x="128" y="270" width="64" height="70" fill="${pele}"/>
      <rect x="90" y="760" width="140" height="340" fill="#34495e"/><rect x="40" y="740" width="240" height="120" rx="30" fill="#34495e"/>
      <rect x="20" y="320" width="280" height="460" rx="110" fill="${roupa}"/>
      <path d="M270 400 Q300 560 270 700" stroke="${roupa}" stroke-width="56" fill="none" stroke-linecap="round"/><circle cx="270" cy="712" r="28" fill="${pele}"/>
      <path d="M130 322 L160 372 L190 322" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="10"/>
      <circle cx="160" cy="210" r="88" fill="${pele}"/>
      ${hair}${eyes}${mouth}
      <circle cx="112" cy="250" r="12" fill="#ff8f8f" opacity=".35"/><circle cx="210" cy="250" r="12" fill="#ff8f8f" opacity=".35"/>
      ${fones}${phone}
    </svg>`;
  }

  // =========================================================
  // Cena 1: o ônibus na rua (0–4 s)
  // =========================================================
  const sky = document.getElementById('sky');
  const S1 = el('div', 'layer');
  const s1cam = el('div', 'layer', S1);
  const cityFar = el('div', 'abs', s1cam, cidade('c1')); Object.assign(cityFar.style, { left: '0', top: '280px', transformOrigin: '0 0' });
  const road = el('div', 'abs', s1cam); Object.assign(road.style, { left: '-600px', top: '1110px', width: '2300px', height: '900px', background: '#5b6573' });
  const curb = el('div', 'abs', s1cam); Object.assign(curb.style, { left: '-600px', top: '1080px', width: '2300px', height: '40px', background: '#c3ccd5' });
  const lanes = el('div', 'abs', s1cam); Object.assign(lanes.style, { left: '-600px', top: '1290px', width: '4000px', height: '18px',
    background: 'repeating-linear-gradient(90deg, #fff 0 120px, transparent 120px 240px)' });
  const bus = el('div', 'abs', s1cam); Object.assign(bus.style, { left: '40px', top: '560px', width: '1000px', height: '600px' });
  // janelas do ônibus, com gente e o Tico na terceira
  const WIN = [0, 1, 2, 3, 4].map((i) => ({ x: 70 + i * 160, y: 110, w: 140, h: 190 }));
  const busSvg = `<svg width="1000" height="600" viewBox="0 0 1000 600">
    <rect x="10" y="40" width="980" height="470" rx="60" fill="#f9fbfd"/>
    <rect x="10" y="40" width="980" height="56" rx="28" fill="#1d3348"/>
    <text x="80" y="80" font-family="Nunito" font-weight="800" font-size="34" fill="#f7931e" letter-spacing="3">07 · CENTRO</text>
    <rect x="10" y="340" width="980" height="46" fill="#1688e8"/>
    <rect x="10" y="386" width="980" height="16" fill="#72c93d"/>
    <rect x="880" y="110" width="96" height="390" rx="16" fill="#cfe3f4" stroke="#1d3348" stroke-width="8"/>
    <line x1="928" y1="114" x2="928" y2="496" stroke="#1d3348" stroke-width="6"/>
    ${WIN.map((w) => `<rect x="${w.x - 6}" y="${w.y - 6}" width="${w.w + 12}" height="${w.h + 12}" rx="22" fill="#1d3348"/>`).join('')}
    <circle cx="220" cy="510" r="82" fill="#1d3348"/><circle cx="760" cy="510" r="82" fill="#1d3348"/>
    <rect x="960" y="420" width="34" height="40" rx="10" fill="#f5b700"/>
  </svg>`;
  el('div', 'layer', bus, busSvg);
  const winEls = WIN.map((w, i) => {
    const d = el('div', 'abs', bus); Object.assign(d.style, { left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px', overflow: 'hidden', borderRadius: '16px', background: '#bfe3ff' });
    if (i === 2) {
      const t = img(TICO('neutro'), 'abs', d); Object.assign(t.style, { width: '300px', left: '-82px', top: '-6px' });
    } else {
      const c = ['#7a4a35', '#f2c9a0', '#c58b62', '#e8b48a'][i % 4];
      d.innerHTML = `<svg width="${w.w}" height="${w.h}"><circle cx="${50 + (i * 23) % 40}" cy="${100 + (i % 2) * 14}" r="44" fill="${c}"/><rect x="${10 + (i * 23) % 40}" y="${150 + (i % 2) * 14}" width="90" height="120" rx="40" fill="${['#ef4444', '#7c3aed', '#1688e8', '#58a92a'][i % 4]}"/><circle cx="${110 - (i * 17) % 30}" cy="${80 + (i % 3) * 10}" r="38" fill="${['#e8b48a', '#7a4a35', '#f2c9a0'][i % 3]}" opacity=".9"/></svg>`;
    }
    return d;
  });
  const wheels = [220, 760].map((x) => { const w = el('div', 'abs', bus, `<svg width="120" height="120" viewBox="-60 -60 120 120"><circle r="52" fill="#3b4b5a"/><circle r="26" fill="#cbd5e1"/><rect x="-4" y="-50" width="8" height="100" fill="#3b4b5a"/><rect x="-50" y="-4" width="100" height="8" fill="#3b4b5a"/></svg>`); Object.assign(w.style, { left: x - 60 + 'px', top: '450px' }); return w; });
  const s1p1 = el('div', 'abs plate', S1, '<span style="font-size:110px">Sem tempo</span><span style="font-size:110px;color:var(--orange)">pra estudar?</span>');
  s1p1.style.top = '20px';
  const s1chip = el('div', 'abs chip', S1, `${svg(ICON.clock, '#f5b700', 48, 2.6)} 7h12 · 40 minutos de ônibus`);
  Object.assign(s1chip.style, { left: '50%', top: '330px' });

  // =========================================================
  // Cena 2: dentro do ônibus lotado (4–18 s)
  // =========================================================
  const S2 = el('div', 'layer');
  const s2cam = el('div', 'layer', S2);   // câmera (zoom no celular)
  const s2bus = el('div', 'layer', s2cam); // balanço do ônibus
  // parede, janelas, teto
  const wall = el('div', 'abs', s2bus); Object.assign(wall.style, { left: '-700px', top: '-700px', width: '2480px', height: '3000px', background: 'linear-gradient(180deg,#d9e4ee 0,#d9e4ee 760px,#efe6d3 760px,#e6d9bd 1930px,#a9b4bf 1930px,#8f9aa6 100%)' });

    {
      const open = eio(prog(t, 19.9, 20.4));
      F.style.clipPath = open >= 1 ? 'none' : `circle(${open * Math.hypot(W, H) * 0.6}px at 50% 50%)`;
      F.style.visibility = t < 19.9 ? 'hidden' : 'visible';
      rays.style.transform = `rotate(${t * 8}deg) scale(${0.8 + 0.2 * open})`;
      set(Fc, { o: t < 19.95 ? 0 : 1 });
      const k1 = spring(t - 20.25, 16, 0.5), k2 = spring(t - 20.55, 18, 0.38);
      set(ft1, { y: 60 * (1 - k1), o: clamp(k1 * 3) });
      set(ft2, { s: lerp(0.3, 1, k2) * (1 + 0.04 * beatPulse(t, 21.0)), o: clamp(k2 * 3), r: -3 });
      const kt = spring(t - 20.15, 11, 0.5);
      const hop = t > 20.8 ? Math.abs(Math.sin((t - 20.8) * Math.PI * 2)) * 30 : 0;
      set(ticoF, { y: 700 * (1 - kt) - hop, s: lerp(0.6, 1, kt), r: Math.sin(t * Math.PI * 2) * 3 });
      const ks = spring(t - 21.1, 14, 0.6);
      set(fsub, { y: 30 * (1 - ks), o: clamp(ks * 3) });
      const kp = spring(t - 21.4, 16, 0.45);
      fpill.style.transform = `translateX(-50%) scale(${kp * (1 + 0.05 * beatPulse(t, 22.0))})`;
      fpill.style.opacity = clamp(kp * 3);
      confs.forEach((c, i) => {
        const at = 20.35 + rnd(i) * 0.5; const p = Math.max(0, t - at);
        const x0 = W * (0.5 + (rnd(i + 1) - 0.5) * 0.3), vx = (rnd(i + 2) - 0.5) * W * 1.4, vy = -H * (0.45 + rnd(i + 3) * 0.55);
        const x = x0 + vx * p * Math.exp(-p * 0.6); const y = H * 0.48 + vy * p + 0.5 * H * 1.15 * p * p;
        set(c, { x, y, r: p * (300 + rnd(i + 4) * 500), sx: Math.cos(p * (6 + rnd(i) * 6)), sy: 1, o: t > at && y < H + 60 ? 1 : 0 });
      });
    }
  }

  window.DURATION = DUR;
  window.seek = seek;
  window.ready = (async () => {
    await document.fonts.ready;
    await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
    seek(0);
    return true;
  })();
  if (!navigator.webdriver) {
    const t0 = performance.now();
    const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    window.ready.then(loop);
  }
})();
</script>
