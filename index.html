<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1688e8" />
    <meta name="description" content="Estude para concursos públicos em forma de aventura: trilha guiada com questões no estilo das bancas, redação com IA, missões diárias e ranking." />
    <link rel="icon" href="/favicon.svg" />
    <script>
      // Tema antes de desenhar a página (evita piscar claro no tema escuro).
      try {
        var p = JSON.parse(localStorage.getItem('aprova-tico:prefs') || '{}');
        document.documentElement.dataset.theme = p.theme === 'dark' || p.theme === 'light' ? p.theme
          : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <title>Aprova Tico — Estude para concursos em forma de aventura</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
