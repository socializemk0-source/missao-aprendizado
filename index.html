<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1688e8" />
    <meta name="description" content="Estude para concursos públicos em forma de aventura: trilha guiada com questões no estilo das bancas, redação com IA, missões diárias e ranking." />
    <link rel="icon" href="/favicon.svg" />
    <!-- Prévia do link (WhatsApp, Instagram, Google). A imagem precisa do endereço completo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aprova Tico" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Aprova Tico — Estude para concursos em forma de aventura" />
    <meta property="og:description" content="Questões no estilo das bancas, explicação em cada resposta e uma trilha que mostra o próximo passo. Grátis para começar." />
    <meta property="og:image" content="https://www.aprovatico.com.br/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="O Tico, uma capivara com mochila, acenando numa trilha até o topo da montanha." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- App instalável (PWA): manifesto, ícone e nome na tela inicial do celular. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aprova Tico" />
    <script>
      // Tema antes de desenhar a página (evita piscar claro no tema escuro).
      try {
        var p = JSON.parse(localStorage.getItem('aprova-tico:prefs') || '{}');
        // Padrão claro; escuro só se o aluno escolheu (ou escolheu "Automático" e o sistema está escuro).
        document.documentElement.dataset.theme = p.theme === 'dark'
          || (p.theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch (e) {}
      // Página inicial no celular: pede já a imagem principal (o maior elemento
      // da tela), sem esperar o JavaScript do app montar a página.
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.href = '/landing/hero-mobile.webp';
        l.media = '(max-width: 640px)';
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
    </script>
    <title>Aprova Tico — Estude para concursos em forma de aventura</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
